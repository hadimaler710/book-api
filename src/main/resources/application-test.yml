# =============================================================================
# Test profile: fresh in-memory H2 per context, demo data seeded, quiet logs.
# Used by @ActiveProfiles("test") in the automated tests.
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

book-api:
  seed:
    enabled: true

logging:
  level:
    root: WARN
    edu.ku.bookapi: INFO
